  generation tooling, built in public on X with documented investigations and
  the AI art itself, per the user''s 2026-10-03 direction. Deck v1 is the working prototype
  and the proof of the hard parts. Widened 2026-10-04 by user declaration: IntronForge
  is an ALL-IN-ONE AI ART PRODUCTION STUDIO; the prompt-studio and intron-depot drafts
  are the first expressions of that direction.

