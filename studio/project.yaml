project: profile-deck
version: 1
north_star: >
  A separate, useful product beyond the personal deck: character-profile
  generation tooling, built in public on X with documented investigations
  and the AI art itself, per the user's 2026-10-03 direction. Deck v1 is
  the working prototype and the proof of the hard parts.
rigor: minimal
engine:
  name: forge-neo
  api: http://127.0.0.1:7860
  note: REST API enabled 2026-10-03; Gradio API cannot carry ADetailer args
deck:
  ui: http://127.0.0.1:7877
  bind: 127.0.0.1
paths:
  profiles: profile_deck/profiles/
  outputs: profile_deck/outputs/
stories:
  - id: deck-mvp
    status: done
    qa: real render observed (local profile), batch x3, review passed
  - id: universal-ratios
    status: done
    qa: second profile inherits universal ratios end to end; lock persists in universal.json
  - id: pnginfo-ingest
    status: done
    notes: >-
      v2 scope 1 shipped + review gate passed (critical UnboundLocalError
      and three parser robustness issues found and fixed). QA evidence:
      real archive pngs from both dialects ingest clean; draft saved,
      rendered, observed. Scope 2 stays open as pnginfo-consolidate.
  - id: prompt-translator
    status: done
    notes: >-
      v2 shipped. Rules table (scaffold, source Cartoon lane, character-count
      tags, quality-token strip, style-lora strip, incase variant normalize,
      style-name-as-token strip) + receipt diff with apply-on-confirm. QA:
      real Pony/Illustrious/SDXL prompts through the live endpoint; null and
      score_9_up-only paths; mutation-idempotent. Review gate found 4 issues
      (lane source not guaranteed, harvested tags not removed, underscored
      quality tokens escaping, null 500) — all fixed and verified.
  - id: danbooru-assist
    status: done
    notes: >-
      v2 shipped. Local autocomplete over the on-disk danbooru dump
      (danbooru_2025-09-01.csv, 183k tags with counts and alias chains,
      found in the EasyUseAnima install). Suggestion panels under both
      prompt fields: exact tag/alias first, then count-ranked prefix and
      substring matches, then a nearest-prefix fallback for multi-word
      phrases. Click or Tab inserts the canonical tag. Offline. Review
      gate: alias split was pipe (dump is comma-separated) and the
      fallback descent aborted early — both fixed and verified.
  - id: lora-visual-browser
    status: done
    notes: >-
      v2 shipped. Card grid with previews, folder filter tags (8 groups from
      the real directory tree), search over names+trigger words, click empty
      card to fetch info, Fetch-all button. Mass enrichment: 100/124 real
      loras enriched (63 with trigger words, ~101 serving previews); the 23
      failures are self-trained models and unfindable packs. macOS ._* junk
      excluded from scan. Two CivitAI quirks solved: image CDN needs UA+
      Accept headers; ComfyUI sidecar hashes reused to skip rehashing.
  - id: tensorart-shell
    status: done
    notes: >-
      v2 shipped. Two-panel shell: top prompt bar (positive, negative,
      Generate/Batch), profile rail left, editor as sectioned cards center
      (Model / Setup / High-definition fix / Detailer), output gallery right.
      Bonus: #profile=character/name deep links. All 49 element IDs and JS
      bindings preserved; ephemeral-run, locks, universal ratios, gallery
      fix verified through a live render and headless screenshots
      (results/shell/).
  - id: pretty-pass
    status: v3
    notes: design system, loading states, toasts, responsive. deliberately last.
  - id: sdxl-styles
    status: done
    qa: cinematic render observed; style template wraps prompt, negative merged (sidecar 20261003_185646)
  - id: controlnet-integrated
    status: done
    qa: canny unit + sai_xl_canny_128lora at weight 1.0, CN block in sidecar infotext, structural guidance observed (20261003_185931)
  - id: output-gallery-fix
    status: done
    notes: /api/outputs listing endpoint; switching profiles no longer clears the output panel
  - id: library-view
    status: v3
    notes: global grid over all renders, thumbnail cache, filters (stories-v3.md)
  - id: ratings-tags
    status: v3
    notes: per-image rating/favorite/tags in a library index; sidecars stay write-once
  - id: similarity-search
    status: v3
    notes: pHash index, find-similar, near-duplicate report for dataset curation
  - id: folder-watcher
    status: v3
    notes: watch Forge output dir, auto-register renders into the library
  - id: prompt-stats
    status: v3
    notes: tag frequencies and prompt stats over sidecar tickets
  - id: wd14-tagger
    status: v3
    notes: local WD14 ONNX tagger, auto-tag archive images; heaviest story, model download
  - id: vault-sync
    status: handed-off
    notes: "AI Art Stack - Oya Handoff V1 Sync.md in the vault; Oya executes the five-round sync"
  - id: dataset-mode-hardening
    status: backlog
    notes: null-safe profile loading, save_result inside batch try, wildcard lines
  - id: anima-lane-adapter
    status: backlog
